<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Inter, Arial, sans-serif">
  <style>
    .frame{fill:#fff;stroke:#c9cdd2;stroke-width:2}
    .nav{fill:#2a2f34}
    .box{fill:#eef1f3;stroke:#cfd4d9;stroke-width:1.5;rx:6}
    .line{fill:#d7dce1}
    .lbl{fill:#7a828b;font-size:13px}
    .lbl-sm{fill:#9aa1a9;font-size:11px}
    .navlbl{fill:#e8eaec;font-size:12px}
    .accent{fill:#c0492b}
    .title{fill:#3a4149;font-size:16px;font-weight:700}
  </style>
  <rect x="1" y="1" width="898" height="658" class="frame" rx="10"/>
  <!-- navbar -->
  <rect x="2" y="2" width="896" height="40" class="nav" rx="9"/>
  <text x="24" y="27" class="navlbl" font-weight="700" font-size="15">Mesa<tspan class="accent">.</tspan></text>
  <text x="90" y="27" class="navlbl">Dashboard</text>
  <text x="170" y="27" class="navlbl">Margins</text>
  <text x="235" y="27" class="navlbl">P&amp;L</text>
  <text x="280" y="27" class="navlbl">Products</text>
  <text x="350" y="27" class="navlbl">Upload</text>
  <rect x="760" y="12" width="120" height="20" fill="#3c4248" rx="5"/>
  <text x="772" y="27" class="navlbl">Restaurant ▾</text>
  <!-- header -->
  <text x="24" y="78" class="title">Dashboard</text>
  <rect x="24" y="90" width="240" height="10" class="line" rx="4"/>
  <!-- date filter -->
  <rect x="560" y="64" width="120" height="34" class="box" rx="6"/>
  <rect x="688" y="64" width="120" height="34" class="box" rx="6"/>
  <rect x="816" y="64" width="60" height="34" fill="#c0492b" rx="6"/>
  <text x="828" y="86" fill="#fff" font-size="12">Apply</text>
  <!-- KPI cards -->
  <g>
    <rect x="24" y="118" width="200" height="70" class="box" rx="8"/>
    <rect x="240" y="118" width="200" height="70" class="box" rx="8"/>
    <rect x="456" y="118" width="200" height="70" class="box" rx="8"/>
    <rect x="672" y="118" width="204" height="70" class="box" rx="8"/>
    <rect x="24" y="118" width="5" height="70" class="accent" rx="2"/>
    <rect x="240" y="118" width="5" height="70" class="accent" rx="2"/>
    <rect x="456" y="118" width="5" height="70" class="accent" rx="2"/>
    <rect x="672" y="118" width="5" height="70" class="accent" rx="2"/>
    <text x="40" y="140" class="lbl-sm">TOTAL REVENUE</text>
    <text x="40" y="168" class="title">$ ___</text>
    <text x="256" y="140" class="lbl-sm">ITEMS SOLD</text>
    <text x="256" y="168" class="title">___</text>
    <text x="472" y="140" class="lbl-sm">AVG TICKET</text>
    <text x="472" y="168" class="title">$ ___</text>
    <text x="688" y="140" class="lbl-sm">GROSS MARGIN</text>
    <text x="688" y="168" class="title">__ %</text>
  </g>
  <!-- revenue-over-time chart -->
  <rect x="24" y="206" width="852" height="150" class="box" rx="8"/>
  <text x="40" y="228" class="lbl-sm">REVENUE OVER TIME</text>
  <polyline points="60,330 140,300 220,320 300,250 380,290 460,270 540,300 620,255 700,285 780,265 850,300"
            fill="none" stroke="#c0492b" stroke-width="2.5"/>
  <!-- top products + doughnut -->
  <rect x="24" y="372" width="500" height="264" class="box" rx="8"/>
  <text x="40" y="394" class="lbl-sm">TOP 10 PRODUCTS BY REVENUE</text>
  <g fill="#d68b78">
    <rect x="180" y="410" width="320" height="14" rx="3"/>
    <rect x="180" y="432" width="280" height="14" rx="3"/>
    <rect x="180" y="454" width="250" height="14" rx="3"/>
    <rect x="180" y="476" width="210" height="14" rx="3"/>
    <rect x="180" y="498" width="180" height="14" rx="3"/>
    <rect x="180" y="520" width="150" height="14" rx="3"/>
    <rect x="180" y="542" width="120" height="14" rx="3"/>
    <rect x="180" y="564" width="95" height="14" rx="3"/>
    <rect x="180" y="586" width="80" height="14" rx="3"/>
    <rect x="180" y="608" width="60" height="14" rx="3"/>
  </g>
  <g fill="#cfd4d9">
    <rect x="60" y="410" width="105" height="10" rx="3"/><rect x="60" y="432" width="105" height="10" rx="3"/>
    <rect x="60" y="454" width="105" height="10" rx="3"/><rect x="60" y="476" width="105" height="10" rx="3"/>
    <rect x="60" y="498" width="105" height="10" rx="3"/><rect x="60" y="520" width="105" height="10" rx="3"/>
  </g>
  <rect x="540" y="372" width="336" height="264" class="box" rx="8"/>
  <text x="556" y="394" class="lbl-sm">REVENUE BY CATEGORY</text>
  <circle cx="660" cy="510" r="72" fill="none" stroke="#c0492b" stroke-width="30"/>
  <circle cx="660" cy="510" r="72" fill="none" stroke="#d6a23e" stroke-width="30" stroke-dasharray="120 452"/>
  <circle cx="660" cy="510" r="72" fill="none" stroke="#6c8a6f" stroke-width="30" stroke-dasharray="70 452" stroke-dashoffset="-120"/>
  <g fill="#cfd4d9">
    <rect x="770" y="470" width="90" height="9" rx="3"/><rect x="770" y="488" width="90" height="9" rx="3"/>
    <rect x="770" y="506" width="90" height="9" rx="3"/><rect x="770" y="524" width="90" height="9" rx="3"/>
    <rect x="770" y="542" width="90" height="9" rx="3"/>
  </g>
</svg>
