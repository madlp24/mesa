<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Inter, Arial, sans-serif">
  <style>
    .frame{fill:#fff;stroke:#c9cdd2;stroke-width:2}
    .nav{fill:#2a2f34}
    .box{fill:#eef1f3;stroke:#cfd4d9;stroke-width:1.5}
    .line{fill:#d7dce1}
    .lbl{fill:#7a828b;font-size:12px}
    .lbl-sm{fill:#9aa1a9;font-size:11px}
    .navlbl{fill:#e8eaec;font-size:12px}
    .accent{fill:#c0492b}
  </style>
  <rect x="1" y="1" width="898" height="718" class="frame" rx="10"/>
  <!-- navbar -->
  <rect x="2" y="2" width="896" height="40" class="nav" rx="9"/>
  <text x="24" y="27" class="navlbl" font-weight="700" font-size="15">Mesa<tspan class="accent">.</tspan></text>
  <text x="700" y="27" class="navlbl">Help</text>
  <text x="745" y="27" class="navlbl">EN ▾</text>
  <text x="800" y="27" class="navlbl">Login</text>
  <rect x="838" y="12" width="46" height="20" fill="#c0492b" rx="5"/>
  <text x="847" y="27" fill="#fff" font-size="11">Sign up</text>
  <!-- hero -->
  <rect x="330" y="70" width="240" height="18" class="box" rx="9"/>
  <text x="360" y="83" class="accent" font-size="10" font-weight="700">SALES ANALYTICS FOR SOFT RESTAURANT</text>
  <rect x="190" y="104" width="520" height="20" class="line" rx="4"/>
  <rect x="230" y="132" width="440" height="20" class="line" rx="4"/>
  <rect x="290" y="160" width="320" height="20" class="line" rx="4"/>
  <rect x="280" y="196" width="340" height="9" fill="#e3e7ea" rx="3"/>
  <rect x="300" y="212" width="300" height="9" fill="#e3e7ea" rx="3"/>
  <rect x="366" y="242" width="120" height="34" fill="#c0492b" rx="6"/>
  <text x="386" y="264" fill="#fff" font-size="12">Try the demo</text>
  <rect x="496" y="242" width="80" height="34" class="box" rx="6"/>
  <text x="514" y="264" class="lbl">Log in</text>
  <!-- how it works -->
  <text x="450" y="326" class="lbl" font-size="15" font-weight="700" text-anchor="middle">How it works</text>
  <g>
    <rect x="60" y="344" width="245" height="110" class="box" rx="8"/>
    <rect x="328" y="344" width="245" height="110" class="box" rx="8"/>
    <rect x="596" y="344" width="245" height="110" class="box" rx="8"/>
    <circle cx="86" cy="372" r="13" class="accent"/><text x="82" y="377" fill="#fff" font-size="12">1</text>
    <circle cx="354" cy="372" r="13" class="accent"/><text x="350" y="377" fill="#fff" font-size="12">2</text>
    <circle cx="622" cy="372" r="13" class="accent"/><text x="618" y="377" fill="#fff" font-size="12">3</text>
    <rect x="74" y="396" width="150" height="10" class="line" rx="3"/>
    <rect x="342" y="396" width="150" height="10" class="line" rx="3"/>
    <rect x="610" y="396" width="150" height="10" class="line" rx="3"/>
    <rect x="74" y="416" width="210" height="7" fill="#e3e7ea" rx="3"/>
    <rect x="74" y="430" width="180" height="7" fill="#e3e7ea" rx="3"/>
    <rect x="342" y="416" width="210" height="7" fill="#e3e7ea" rx="3"/>
    <rect x="342" y="430" width="180" height="7" fill="#e3e7ea" rx="3"/>
    <rect x="610" y="416" width="210" height="7" fill="#e3e7ea" rx="3"/>
    <rect x="610" y="430" width="170" height="7" fill="#e3e7ea" rx="3"/>
  </g>
  <!-- everything you get: 3x2 grid -->
  <text x="450" y="496" class="lbl" font-size="15" font-weight="700" text-anchor="middle">Everything you get</text>
  <g>
    <rect x="60" y="514" width="245" height="80" class="box" rx="8"/>
    <rect x="328" y="514" width="245" height="80" class="box" rx="8"/>
    <rect x="596" y="514" width="245" height="80" class="box" rx="8"/>
    <rect x="60" y="602" width="245" height="80" class="box" rx="8"/>
    <rect x="328" y="602" width="245" height="80" class="box" rx="8"/>
    <rect x="596" y="602" width="245" height="80" class="box" rx="8"/>
  </g>
  <g fill="#cfd4d9">
    <circle cx="86" cy="540" r="10"/><rect x="74" y="558" width="120" height="9" rx="3"/>
    <circle cx="354" cy="540" r="10"/><rect x="342" y="558" width="120" height="9" rx="3"/>
    <circle cx="622" cy="540" r="10"/><rect x="610" y="558" width="120" height="9" rx="3"/>
    <circle cx="86" cy="628" r="10"/><rect x="74" y="646" width="120" height="9" rx="3"/>
    <circle cx="354" cy="628" r="10"/><rect x="342" y="646" width="120" height="9" rx="3"/>
    <circle cx="622" cy="628" r="10"/><rect x="610" y="646" width="120" height="9" rx="3"/>
  </g>
</svg>
