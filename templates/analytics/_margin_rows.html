{% load i18n mesa %}
<div class="table-responsive">
  <table class="table align-middle">
    <thead>
      <tr>
        <th>{% trans "Product" %}</th>
        <th>{% trans "Group" %}</th>
        <th class="num">{% trans "Sales" %}</th>
        <th class="num">{% trans "Margin" %}</th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td><a href="{% url 'catalog:product_detail' row.product_id %}">{{ row.name }}</a></td>
        <td class="text-muted small">{{ row.category }}</td>
        <td class="num">{{ row.revenue|cop }}</td>
        <td class="num">
          {% if row.margin_pct is None %}
            <span class="text-muted">&ndash;</span>
          {% else %}
            <strong class="{% if row.margin_pct < 0 %}text-danger{% endif %}">{{ row.margin_pct|pct }}</strong>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
