# Ruff configuration for Mesa.
#
# Until now this repo had no ruff config at all, so ruff ran on whatever its bare
# defaults happened to be the day CI installed it. Ruff 0.16 widened that default
# set from roughly 60 rules to 416 (FURB, RUF, ISC, DTZ, PLR, EXE and others) and
# CI failed with 219 findings on code that had been green for months.
#
# The decision: adopt ruff's defaults rather than freeze a rule list. The default
# set is a curated subset of many families, not whole families, so it cannot be
# reproduced with a `select` of family prefixes without pulling in far more than
# ruff itself considers default. What this file is for is the other half of that
# decision -- a written record of the rules Mesa deliberately does NOT run, so a
# future reader sees a judgement call instead of a silent suppression.
#
# A ruff upgrade may still surface new findings. That is now a lint failure with a
# config file to record the verdict in, not a mystery.

target-version = "py312"

[lint]
# Ruff 0.16 dropped F403 from its defaults. Mesa's settings modules are built on
# `from .base import *`, which is exactly what F403 is about, so keep it running:
# the star imports carry a deliberate `# noqa: F403` and that should stay honest.
extend-select = ["F403"]

ignore = [
    # RUF012 -- mutable-class-default: "annotate with typing.ClassVar".
    #
    # Wrong for Django, and it fires on nearly every model and every migration.
    # Django reads `Meta.ordering` and `Meta.constraints` off the class through
    # its own metaclass, and a migration's `dependencies`/`operations` are read
    # by the migration loader the same way. These are declarative framework
    # input, not shared mutable state that instances could scribble on -- the
    # aliasing bug RUF012 exists to catch cannot happen here. Annotating them
    # `ClassVar` to satisfy the linter would add noise to 30 sites and teach the
    # wrong thing about how Django classes work.
    "RUF012",

    # FURB157 -- verbose-decimal-constructor: `Decimal("0")` -> `Decimal(0)`.
    #
    # Mesa builds every monetary Decimal from a string, without exception, so the
    # habit never lapses into `Decimal(0.1)` and its binary-float error. The 95
    # sites this flags are all integer-valued strings sitting next to values like
    # `Decimal("31481.48")` that the rule leaves alone; "fixing" them would make
    # money construction inconsistent line by line and would be actively harmful
    # to copy. The uniformity is the point, not verbosity.
    "FURB157",
]

[lint.per-file-ignores]
# Migrations are generated by `makemigrations`. Holding machine-written files to
# a hand-written standard means editing them back on every regeneration.
"*/migrations/*.py" = ["E501", "I001"]
